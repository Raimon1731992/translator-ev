name: Build APK

# Chay khi co bat ky thay doi nao duoc day len, hoac bam nut chay tay.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Dong goi TranslatorEV.apk
    # Ghim ubuntu-24.04 thay vi ubuntu-latest, de thang 10/2026 GitHub
    # doi sang Ubuntu 26 thi workflow nay khong bi anh huong.
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v5

      - name: Xem cau truc thu muc trong repo
        run: |
          echo "--- Cay thu muc (3 cap dau) ---"
          find . -maxdepth 3 -not -path "./.git/*" | sort | head -60

      # Tu do tim thu muc chua settings.gradle -> chay duoc du du an nam
      # o goc repo hay bi long them mot cap thu muc.
      - name: Tim thu muc du an Gradle
        id: find
        run: |
          set -e
          DIR=$(find . \( -name settings.gradle -o -name settings.gradle.kts \) \
                -not -path "*/build/*" -not -path "./.git/*" \
                | head -n 1 | xargs -r dirname)
          if [ -z "$DIR" ]; then
            echo "::error::Khong tim thay settings.gradle trong repo. Ban chua tai thu muc du an len, hoac tai thieu file."
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Du an Gradle nam o: $DIR"
          ls -la "$DIR"

      - name: Cai JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai Android SDK
        uses: android-actions/setup-android@v4

      - name: Cai platform 34 va build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # Cai dung Gradle 8.7 - ban di kem voi Android Gradle Plugin 8.5.2.
      # Khong dung "gradle wrapper" nua: lenh do muon ban Gradle cai san tren
      # may chu, ma ban do co the la Gradle 9 va se xung dot voi AGP 8.5.
      - name: Cai Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build ban debug
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: In thong tin chan doan khi build hong
        if: failure()
        run: |
          echo "--- java ---";        java -version 2>&1 || true
          echo "--- gradle ---";      gradle --version 2>&1 | head -20 || true
          echo "--- ANDROID_HOME ---"; echo "${ANDROID_HOME:-chua dat}"
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || true
          echo "--- noi dung thu muc du an ---"
          ls -la "${{ steps.find.outputs.dir }}" || true
          echo "--- app/build.gradle ---"
          cat "${{ steps.find.outputs.dir }}/app/build.gradle" 2>/dev/null || true

      - name: Gom file APK lai mot cho
        run: |
          mkdir -p out
          find . -name "*.apk" -path "*outputs*" -exec cp {} out/ \; || true
          if [ -f out/app-debug.apk ]; then
            mv out/app-debug.apk out/TranslatorEV.apk
          fi
          echo "--- File se tai len ---"
          ls -la out

      - name: Tai file APK len (muc Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: TranslatorEV-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error
