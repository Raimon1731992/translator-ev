plugins {
    id 'com.android.application'
}

// Khoa ky co dinh. Nho co no, moi ban build moi deu cai de len ban cu duoc
// (khong phai go app, khong mat lich su dich).
// Tep .jks duoc luu duoi dang base64 de dan/sua duoc tren giao dien web GitHub;
// workflow se giai ma ra .jks truoc khi build.
def ksFile = file("keystore/translatorev.jks")

android {
    namespace 'com.skymavis.translatorev'
    compileSdk 34

    defaultConfig {
        applicationId "com.skymavis.translatorev"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        fixed {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword "translatorev"
                keyAlias "translatorev"
                keyPassword "translatorev"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.fixed : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Ung dung khong dung thu vien ngoai nao - chi dung API san co cua Android.
dependencies { }
